spring:
  application:
    name: elevideo-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: elevideo
      maximum-pool-size: ${DB_POOL_MAX_SIZE:2}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      pool-name: ${spring.application.name}-pool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: elevideo
        hbm2ddl.create_namespaces: true

server:
  port: ${PORT:8081}

security:
  jwt:
    secret: ${JWT_SECRET:TTE1M0NyM3RLM3lQYXJhSldUc011eVMyZ3VyNHlMNHJnNA==}
    expiration:
      authentication: ${JWT_EXPIRATION-AUTHENTICATION:3600000}
      email-verification: ${JWT_EXPIRATION-EMAIL-VERIFICATION:1800000}
      password-reset: ${JWT_EXPIRATION-RESET-PASSWORD:1800000}
      python-service: ${JWT_EXPIRATION_PYTHON-SERVICE:300000}


app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    verify-email-path: ${FRONTEND_VERIFY_EMAIL_PATH:/verify-email}
    reset-password-path: ${FRONTEND_RESET_PASSWORD_PATH:/reset-password}


resend:
  api-key: ${RESEND_APIKEY}
  from-email: ${RESEND_EMAIL}
  from-name: ${RESEND_NAME}

springdoc:
  swagger-ui:
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    org.hibernate.SQL: ERROR
    org.hibernate.type: ERROR
    org.hibernate.stat: ERROR


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}


web:
  cors:
    allowed-origins: ${CORS_ALLOWED:http://localhost:*}


python:
  service:
    url: ${PYTHON_SERVICE_BASE_URL:http://127.0.0.1:8001}
    api-key: ${PYTHON_SERVICE_APIKEY:prueba}

