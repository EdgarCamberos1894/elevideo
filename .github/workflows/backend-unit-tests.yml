name: Backend unit tests

on:
  pull_request:
    branches: [refactor-code]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-unit-tests.yml'
  push:
    branches: [refactor-code]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-unit-tests.yml'

permissions:
  contents: read

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test processing business rules without external services
        run: bash ./mvnw -B -ntp '-Dtest=*UnitTest' test
